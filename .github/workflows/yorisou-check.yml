name: Yorisou Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # OSF-1 — the Life OS acceptance, against a real PostgreSQL 17.
  #
  # This is the only test in the repository that EXECUTES account erasure against the five Life OS
  # tables rather than reasoning about the migration text, and until now it ran only on a developer's
  # machine. Every property it covers is one where "we checked once" is not good enough: whether the
  # migrations apply in lineage order, whether RLS and the grants survive an edit, whether an
  # unconfirmed memory can be written, and whether a deleted account really loses its rows.
  #
  # PostgreSQL 17 because Production runs 17 and the harness refuses anything else. The database name
  # is the one the harness's own DSN guard requires, so this job cannot be repointed at a real
  # database by editing the URL alone.
  life-os-postgres:
    name: OSF-1 Life OS PostgreSQL Acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: osf1_acceptance
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d osf1_acceptance"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Migration execution, RLS, account erasure and the memory-confirmation constraint are all
      # inside this one harness — it applies every migration in lineage order first, so a migration
      # that fails to apply fails here before any assertion runs.
      - name: Life OS acceptance (migrations, RLS, erasure, memory confirmation)
        run: npm run test:osf1-postgres
        env:
          OSF1_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/osf1_acceptance

      # ARCH-P3. DD-1 database acceptance on the same service, in its OWN database (the harness's
      # DSN guard requires the dd1_acceptance name, so this step cannot be repointed either):
      # table, RLS, RPC-only mutation, one-per-owner/day/pack, idempotent completion,
      # first-writer-wins, and REAL account erasure of discovery rows via the shipped function.
      - name: Daily Discovery acceptance (DD-1 schema, idempotency, erasure)
        env:
          DD1_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dd1_acceptance
        run: |
          psql postgresql://postgres:postgres@localhost:5432/osf1_acceptance -c 'create database dd1_acceptance;'
          npm run test:arch-p3-db

      # SHR-1. The privacy boundary crosses here on purpose, so the proofs are database-level:
      # RLS and bounded grants, RPC-only mutation, idempotent publish, an IMMUTABLE payload (a
      # changed card cannot silently replace an active link), owner-only idempotent revoke that a
      # non-owner cannot perform, transactional publish/revoke audit that is append-only and
      # content-free, source-result erasure darkening derived links, and account erasure removing
      # ShareObjects. Its own isolated database, like every other acceptance harness here.
      - name: sharing.core acceptance (SHR-1 schema, immutability, revoke, audit, erasure)
        env:
          SHR1_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shr1_acceptance
        run: |
          psql postgresql://postgres:postgres@localhost:5432/osf1_acceptance -c 'create database shr1_acceptance;'
          npm run test:arch-p4-db

  # OSF-1 GATE 3 — the migration lineage rehearsed forwards AND backwards.
  #
  # Separate from the acceptance job because it proves a different thing. Acceptance proves the
  # schema behaves once applied; this proves the lineage can be REVERSED and RE-APPLIED. Until it
  # existed, every migration's ROLLBACK block was an untested assertion — a procedure nobody had run,
  # written by someone who was not going to be the one running it during an incident.
  #
  # The re-apply is the step that earns its place in CI: a rollback that leaves a stale function
  # overload, or drops a constraint it does not recreate, passes a one-way test and fails here.
  life-os-gate3:
    name: OSF-1 Gate 3 migration rehearsal (rollback + re-apply)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: osf1_acceptance
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d osf1_acceptance"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Gate 3 rehearsal (baseline, apply, rollback, re-apply, erasure)
        run: bash tests/life-os/gate3-migration-rehearsal.sh
        env:
          OSF1_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/osf1_acceptance

  agent-runtime-postgres:
    name: Agent Runtime PostgreSQL Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yorisou_agent_runtime_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d yorisou_agent_runtime_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test:agent-runtime
      - run: npm run test:c02
      - run: npm run test:relationship-fatigue
      - run: npm run test:experience-cards
      - run: npm run test:agent-runtime:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yorisou_agent_runtime_test
      - run: npx tsc --noEmit

  por1-deletion-resume-postgres:
    name: POR-1 Deletion Resume Engine + Mutation Fence (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yorisou_por1_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d yorisou_por1_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # The eleven required concurrency scenarios, driven by explicit latches rather than by timing,
      # against a disposable database. The grace-period cases use the injected clock, so the whole
      # suite runs in seconds instead of waiting out three real minutes.
      - name: POR-1 barrier proofs (cursor, single-writer executor, fence, grace)
        run: npm run test:por1-resume:db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/yorisou_por1_test

  check:
    name: Lint, Build & Env Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (report-only)
        # Full-repo lint is temporarily report-only because origin/main contains
        # existing product-code lint debt. Tighten this to a hard gate after the
        # lint debt cleanup PR lands (app/admin, InsightsPreview, MotionReveal,
        # SupportWorkspace, reservation-mobility-support, lib/insights).
        run: npm run lint || true

      - name: TypeScript check
        run: npx tsc --noEmit

      # ARCH-P1. The platform contract guards are a HARD gate from here on: brand isolation, no
      # platform→product import inversion, the twelve canonical capability ids, the governed event
      # envelope, and the v0.7.0 superset mapping all fail the build when they drift. Deliberately
      # not report-only — the guards exist so contract drift is a red build, not a review comment.
      - name: Platform architecture contract guards
        run: npm run test:platform-contracts

      - name: ARCH-P1 typed-event seam (state.checkin_completed.v1)
        run: npm run test:arch-p1

      # ARCH-P2. The state.core boundary is a HARD gate: two adapters over the two legacy stores,
      # no dual write, DCI/current-moment semantics lossless, provenance owner-free, Today source
      # stability, the P1 seam intact, and the timeline named as the one P6 exception.
      - name: ARCH-P2 state.core adapter boundary
        run: npm run test:arch-p2

      # ARCH-P3. Daily Discovery: brand-free discovery contract, the sixteen locked results, the
      # content-safety register, no personal-store reads, deterministic one-per-day semantics,
      # closed-by-default gates, and the erasure-plan membership of the new family.
      - name: ARCH-P3 Daily Discovery boundary
        run: npm run test:arch-p3

      - name: ARCH-P4 sharing.core boundary (Imairo ShareObject)
        run: npm run test:arch-p4

      - name: C02 definition and scoring checks
        run: npm run test:c02

      - name: Relationship-fatigue return-loop checks
        run: npm run test:relationship-fatigue

      - name: Experience Card contracts
        run: npm run test:experience-cards

      - name: Result-reveal contracts (incl. YRR-1 aria-hidden/inert gate)
        run: npm run test:result-reveal

      # PXR-1. The 120Q moved to its own canonical route and `/check-in` became a compatibility
      # redirect. These guard the thing that break is easiest to miss: the redirect must carry the
      # LINE entry context, because the runtime reads it to decide how completion navigates, so a
      # regression still returns 200 and still shows the right product.
      - name: PXR-1 route semantics and LINE mini-app entry compatibility
        run: |
          npm run test:pxr1-routes
          npm run test:pxr1-line-compat
          npm run test:checkin-runtime

      # OSF-1. The erasure-coverage guard is the one that matters most here: POR-1's erasure plan is
      # a hardcoded array, so a future migration adding an owner-linked table would silently leave
      # that table behind at account deletion while the job still reports success. This step is what
      # turns that from "someone has to remember" into a red build.
      - name: OSF-1 Life OS contracts, AI boundary and erasure coverage
        run: |
          npm run test:osf1-contract
          npm run test:osf1-ai-boundary
          npm run test:osf1-erasure-coverage
          npm run test:osf1-boundaries
          npm run test:osf1-regression-repair
          npm run test:osf1-activation

      - name: Imairo snapshot contracts (RTR-1 private save)
        run: npm run test:imairo-snapshot

      - name: Candidate intake contracts (CIF-1 foundation)
        run: npm run test:candidate-intake

      # ── POR-1 ────────────────────────────────────────────────────────────────
      - name: POR-1 runtime controls and flag-off baseline equivalence
        run: |
          npm run test:por1-controls
          npm run gate:por1-flag-off-baseline

      - name: POR-1 mutation-fence rollout rule and write contexts
        run: |
          npm run test:por1-fence
          npm run test:por1-context
          npm run test:por1-transport

      # Hard gates, deliberately not report-only. The 108c939 hosted acceptance failed a real
      # deletion because the database lacked the erasure interface the code calls, and nothing in CI
      # could have caught it: the readiness rule, the runtime wiring and the Preview runtime contract
      # all existed only as local commands. A regression in any of these must fail Yorisou Check.
      # Release-blocking. The frozen source is what makes 101-108 verifiable without a database:
      # live Preview stopped being a valid compiler source when it received the 202608050002 runtime
      # overlay, and the Preview lineage is not linearly replayable, so the committed source and this
      # gate are the only thing standing between a promotion set and an unverifiable one.
      - name: POR-1 frozen promotion source — regenerates 101-108 byte for byte (no database)
        run: |
          npm run por1:promotion-source-check
          npm run test:por1-promotion-source

      # Three different questions, deliberately named apart:
      #   readiness rule     — the pure decision table
      #   structural guard   — the policy is wired where it belongs (reads source)
      #   RUNTIME EXECUTION  — executeDeletion is actually invoked and asserted on
      #   live-contract      — the deployed application's database interfaces exist
      - name: POR-1 erasure authority — readiness rule and structural wiring guard
        run: |
          npm run test:por1-erasure-authority-readiness
          npm run test:por1-erasure-runtime-path

      - name: POR-1 erasure authority — ACTUAL runtime execution of executeDeletion
        run: npm run test:por1-erasure-runtime-execution

      - name: POR-1 Preview live-contract shape guard
        run: npm run test:por1-preview-runtime-contract

      # Added after the 2026-08-10 Production deletion incident, where two accounts were locked out
      # with their data intact and the recorded error named the wrong subsystem entirely. Each of
      # these guards one link in that chain, and each is release-blocking — never report-only.
      - name: POR-1 deletion incident regressions — error truth, transport, diagnostics, recovery
        run: |
          npm run test:por1-bounded-errors
          npm run test:por1-erasure-transport
          npm run test:por1-authority-diagnostic
          npm run test:por1-incident-recovery
          npm run test:por1-deletion-request-guard
          npm run test:por1-store-read-authority
          npm run test:por1-stale-store-viewer

      - name: POR-1 identity scope, deletion lock and store boundary
        run: |
          npm run test:por1-deletion
          npm run test:por1-boundary
          npm run test:por1-namespace
          npm run test:por1-line-scope
          npm run test:por1-erasure-authority

      # The fence is enforced at runtime by write contexts; this guards the half a runtime check
      # cannot see — a new caller reaching past the fenced API, or the minting function leaking.
      - name: POR-1 raw-write source guard
        run: npm run guard:por1-raw-writes

      - name: Report library is bundled and in sync with its markdown source
        run: |
          npm run check:report-registry
          npm run test:por1-report-delivery
          npm run check:evidence-hygiene:selftest
          npm run test:por1-preview-classifier
          npm run test:por1-job-recovery
          npm run test:por1-production-coverage
          npm run test:por1-sql-normalizer
          npm run test:por1-promotion-contract
          npm run test:por1-local-store
          npm run test:shared-store
          npm run test:por1-store-ownership
          npm run test:por1-adapter-ownership
          npm run test:por1-readiness-matrix
          npm run guard:por1-evidence-secrets
          npm run test:por1-deletion-readiness

      - name: Secret-pattern check
        run: "! git grep -nE '(sk-[A-Za-z0-9]{20,}|eyJ[a-zA-Z0-9_-]{20,}|sbp_[A-Za-z0-9_-]{20,})'"

      - name: Env check (informational)
        run: npm run check:env
        # Exits 0 even when vars are missing — informational only in CI
        continue-on-error: false

      - name: Build
        run: npm run build
        env:
          # Provide safe defaults so build doesn't fail on missing optional vars
          YORISOU_SHARED_STORE_REGION: us-east-2
          OPENAI_MODEL: gpt-4.1-mini
          MISTRAL_MODEL: mistral-small-latest

  smoke-openclaw:
    name: OpenClaw Webhook Smoke
    runs-on: ubuntu-latest
    needs: check
    if: vars.OPENCLAW_SMOKE_ENABLED == 'true'
    # Enable by setting repository variable OPENCLAW_SMOKE_ENABLED=true
    # and repository secrets OPENCLAW_WEBHOOK_URL + OPENCLAW_WEBHOOK_TOKEN

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: OpenClaw smoke
        run: node scripts/openclaw-webhook-smoke.mjs
        env:
          OPENCLAW_WEBHOOK_URL: ${{ secrets.OPENCLAW_WEBHOOK_URL }}
          OPENCLAW_WEBHOOK_TOKEN: ${{ secrets.OPENCLAW_WEBHOOK_TOKEN }}

  smoke-hermes:
    name: Hermes Webhook Smoke
    runs-on: ubuntu-latest
    needs: check
    if: vars.HERMES_SMOKE_ENABLED == 'true'
    # Enable by setting repository variable HERMES_SMOKE_ENABLED=true
    # and repository secrets HERMES_WEBHOOK_URL + HERMES_WEBHOOK_TOKEN

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Hermes smoke
        run: node scripts/hermes-webhook-smoke.mjs
        env:
          HERMES_WEBHOOK_URL: ${{ secrets.HERMES_WEBHOOK_URL }}
          HERMES_WEBHOOK_TOKEN: ${{ secrets.HERMES_WEBHOOK_TOKEN }}
