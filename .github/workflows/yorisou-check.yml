name: Yorisou Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  agent-runtime-postgres:
    name: Agent Runtime PostgreSQL Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yorisou_agent_runtime_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d yorisou_agent_runtime_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test:agent-runtime
      - run: npm run test:c02
      - run: npm run test:relationship-fatigue
      - run: npm run test:experience-cards
      - run: npm run test:agent-runtime:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yorisou_agent_runtime_test
      - run: npx tsc --noEmit

  por1-deletion-resume-postgres:
    name: POR-1 Deletion Resume Engine + Mutation Fence (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yorisou_por1_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d yorisou_por1_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # The eleven required concurrency scenarios, driven by explicit latches rather than by timing,
      # against a disposable database. The grace-period cases use the injected clock, so the whole
      # suite runs in seconds instead of waiting out three real minutes.
      - name: POR-1 barrier proofs (cursor, single-writer executor, fence, grace)
        run: |
          npm run test:por1-resume:db
          npm run test:por1-incident-executable-path
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/yorisou_por1_test

  check:
    name: Lint, Build & Env Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (report-only)
        # Full-repo lint is temporarily report-only because origin/main contains
        # existing product-code lint debt. Tighten this to a hard gate after the
        # lint debt cleanup PR lands (app/admin, InsightsPreview, MotionReveal,
        # SupportWorkspace, reservation-mobility-support, lib/insights).
        run: npm run lint || true

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: C02 definition and scoring checks
        run: npm run test:c02

      - name: Relationship-fatigue return-loop checks
        run: npm run test:relationship-fatigue

      - name: Experience Card contracts
        run: npm run test:experience-cards

      - name: Result-reveal contracts (incl. YRR-1 aria-hidden/inert gate)
        run: npm run test:result-reveal

      - name: Imairo snapshot contracts (RTR-1 private save)
        run: npm run test:imairo-snapshot

      - name: Candidate intake contracts (CIF-1 foundation)
        run: npm run test:candidate-intake

      # ── POR-1 ────────────────────────────────────────────────────────────────
      - name: POR-1 runtime controls and flag-off baseline equivalence
        run: |
          npm run test:por1-controls
          npm run gate:por1-flag-off-baseline

      - name: POR-1 mutation-fence rollout rule and write contexts
        run: |
          npm run test:por1-fence
          npm run test:por1-context
          npm run test:por1-transport

      # Hard gates, deliberately not report-only. The 108c939 hosted acceptance failed a real
      # deletion because the database lacked the erasure interface the code calls, and nothing in CI
      # could have caught it: the readiness rule, the runtime wiring and the Preview runtime contract
      # all existed only as local commands. A regression in any of these must fail Yorisou Check.
      # Release-blocking. The frozen source is what makes 101-108 verifiable without a database:
      # live Preview stopped being a valid compiler source when it received the 202608050002 runtime
      # overlay, and the Preview lineage is not linearly replayable, so the committed source and this
      # gate are the only thing standing between a promotion set and an unverifiable one.
      - name: POR-1 frozen promotion source — regenerates 101-108 byte for byte (no database)
        run: |
          npm run por1:promotion-source-check
          npm run test:por1-promotion-source

      # Three different questions, deliberately named apart:
      #   readiness rule     — the pure decision table
      #   structural guard   — the policy is wired where it belongs (reads source)
      #   RUNTIME EXECUTION  — executeDeletion is actually invoked and asserted on
      #   live-contract      — the deployed application's database interfaces exist
      - name: POR-1 erasure authority — readiness rule and structural wiring guard
        run: |
          npm run test:por1-erasure-authority-readiness
          npm run test:por1-erasure-runtime-path

      - name: POR-1 erasure authority — ACTUAL runtime execution of executeDeletion
        run: npm run test:por1-erasure-runtime-execution

      - name: POR-1 Preview live-contract shape guard
        run: npm run test:por1-preview-runtime-contract

      # Added after the 2026-08-10 Production deletion incident, where two accounts were locked out
      # with their data intact and the recorded error named the wrong subsystem entirely. Each of
      # these guards one link in that chain, and each is release-blocking — never report-only.
      - name: POR-1 deletion incident regressions — error truth, transport, diagnostics, recovery
        run: |
          npm run test:por1-bounded-errors
          npm run test:por1-erasure-transport
          npm run test:por1-authority-diagnostic
          npm run test:por1-incident-recovery
          npm run test:por1-incident-correlation
          npm run test:por1-founder-authority
          npm run test:por1-population-semantics
          npm run test:por1-incident-evidence
          npm run por1:verify-incident-evidence -- --offline
          npm run test:por1-deletion-request-guard
          npm run test:por1-store-read-authority
          npm run test:por1-stale-store-viewer

      - name: POR-1 identity scope, deletion lock and store boundary
        run: |
          npm run test:por1-deletion
          npm run test:por1-boundary
          npm run test:por1-namespace
          npm run test:por1-line-scope
          npm run test:por1-erasure-authority

      # The fence is enforced at runtime by write contexts; this guards the half a runtime check
      # cannot see — a new caller reaching past the fenced API, or the minting function leaking.
      - name: POR-1 raw-write source guard
        run: npm run guard:por1-raw-writes

      - name: Report library is bundled and in sync with its markdown source
        run: |
          npm run check:report-registry
          npm run test:por1-report-delivery
          npm run check:evidence-hygiene:selftest
          npm run test:por1-preview-classifier
          npm run test:por1-job-recovery
          npm run test:por1-production-coverage
          npm run test:por1-sql-normalizer
          npm run test:por1-promotion-contract
          npm run test:por1-local-store
          npm run test:shared-store
          npm run test:por1-store-ownership
          npm run test:por1-adapter-ownership
          npm run test:por1-readiness-matrix
          npm run guard:por1-evidence-secrets
          npm run test:por1-deletion-readiness

      - name: Secret-pattern check
        run: "! git grep -nE '(sk-[A-Za-z0-9]{20,}|eyJ[a-zA-Z0-9_-]{20,}|sbp_[A-Za-z0-9_-]{20,})'"

      - name: Env check (informational)
        run: npm run check:env
        # Exits 0 even when vars are missing — informational only in CI
        continue-on-error: false

      - name: Build
        run: npm run build
        env:
          # Provide safe defaults so build doesn't fail on missing optional vars
          YORISOU_SHARED_STORE_REGION: us-east-2
          OPENAI_MODEL: gpt-4.1-mini
          MISTRAL_MODEL: mistral-small-latest

  smoke-openclaw:
    name: OpenClaw Webhook Smoke
    runs-on: ubuntu-latest
    needs: check
    if: vars.OPENCLAW_SMOKE_ENABLED == 'true'
    # Enable by setting repository variable OPENCLAW_SMOKE_ENABLED=true
    # and repository secrets OPENCLAW_WEBHOOK_URL + OPENCLAW_WEBHOOK_TOKEN

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: OpenClaw smoke
        run: node scripts/openclaw-webhook-smoke.mjs
        env:
          OPENCLAW_WEBHOOK_URL: ${{ secrets.OPENCLAW_WEBHOOK_URL }}
          OPENCLAW_WEBHOOK_TOKEN: ${{ secrets.OPENCLAW_WEBHOOK_TOKEN }}

  smoke-hermes:
    name: Hermes Webhook Smoke
    runs-on: ubuntu-latest
    needs: check
    if: vars.HERMES_SMOKE_ENABLED == 'true'
    # Enable by setting repository variable HERMES_SMOKE_ENABLED=true
    # and repository secrets HERMES_WEBHOOK_URL + HERMES_WEBHOOK_TOKEN

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Hermes smoke
        run: node scripts/hermes-webhook-smoke.mjs
        env:
          HERMES_WEBHOOK_URL: ${{ secrets.HERMES_WEBHOOK_URL }}
          HERMES_WEBHOOK_TOKEN: ${{ secrets.HERMES_WEBHOOK_TOKEN }}
