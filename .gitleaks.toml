# Gitleaks configuration for yorisou-online.
#
# Extends the full default gitleaks ruleset (no rule is removed or weakened) and
# allowlists ONLY the governance integrity checksum manifests. Those two files are
# SHA-256 digests of PUBLIC governance documents, verified byte-for-byte by the
# governance integrity gate (`npm run test:agent-runtime`). A digest keyed by a
# filename containing an "auth" substring (e.g. `annex/PRODUCTION_DATA_MODEL_AUTHORITY.md`)
# can false-positive the `generic-api-key` rule when the hex digest's entropy crosses
# the threshold, but these files contain no credentials, tokens, or secrets. This
# allowlist does not weaken secret detection anywhere else in the tree.
title = "yorisou-online gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Governance integrity checksum manifests (public-document digests, not secrets)"
paths = [
  '''lib/server/agent-runtime/governance-checksums\.json''',
  '''resources/governance/(current|archive)/.*/?SHA256SUMS\.txt''',
  '''resources/governance/(current|archive)/.*SHA256SUMS\.txt''',
]
# Named browser-storage keys and a fixed test UUID, not credentials. The
# `generic-api-key` rule matches `*_KEY = "..."` assignments; these values are
# PUBLIC identifiers (sessionStorage key names shipped to every browser, and a
# documentation UUID in a unit test). Matched by exact value — no rule removed,
# no path excluded, nothing else in the tree is exempted.
regexes = [
  '''yorisou\.result\.pending-(claim|intent)\.v1''',
  '''11111111-2222-4333-8444-555555555555''',
]
